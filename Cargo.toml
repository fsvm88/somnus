[workspace]
members  = ["crates/somnus", "crates/somnus-sensory", "crates/somnus-encoding", "crates/somnus-perception", "crates/somnus-memory", "crates/somnus-metrics"]
resolver = "2"

[workspace.dependencies]
anyhow             = "1"
clap               = { version = "4", features = ["derive"] }
cpal               = "0.18"
crossbeam-channel  = "0.5"
ffmpeg-next        = "9"
ndarray            = "0.17"
rayon              = "1.12"
nokhwa             = { version = "0.10", features = ["input-native"] }
ort                = { version = "2.0.0-rc.12", features = ["load-dynamic", "ndarray"] }
rubato             = "3.0"
rustfft            = "6"
thiserror          = "2"
tokio              = { version = "1", features = ["full"] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde_json         = "1"
burn               = { version = "0.21", features = ["wgpu", "autodiff", "ndarray", "simd"] }
burn-ndarray       = { version = "0.21", features = ["multi-threads", "simd"] }
safetensors        = "0.8"
hnsw_rs            = "0.3"
memmap2            = "0.9"
serde              = { version = "1", features = ["derive"] }
bitcode            = { version = "0.6", features = ["serde"] }
somnus-metrics        = { path = "crates/somnus-metrics" }

# Profile for flamegraph: release-optimised but with debug symbols intact so
# perf/flamegraph can map addresses back to source.
[profile.release-debug]
inherits = "release"
debug    = true
