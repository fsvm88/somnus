<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1120" font-family="monospace, 'Courier New', Courier, monospace" font-size="11">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#555"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4455aa"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#cc7700"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#447744"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#775599"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#993333"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1400" height="1120" fill="#f8f8f8"/>

  <!-- Title -->
  <text x="700" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">somnus — architecture (as of 2026-08-16)</text>
  <text x="700" y="50" text-anchor="middle" font-size="11" fill="#555">Data flows top to bottom. Solid arrows: wake-time flow. Dashed arrows: optional, top-down, or recall paths.</text>

  <!-- ═══ INPUTS ═══ -->
  <rect x="40" y="62" width="400" height="58" rx="8" fill="none" stroke="#aabbdd" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="50" y="75" font-size="9" fill="#7788bb">somnus-sensory</text>

  <rect x="60" y="78" width="170" height="36" rx="6" fill="#dce8f8" stroke="#4477cc" stroke-width="1.5"/>
  <text x="145" y="93" text-anchor="middle" font-weight="bold" fill="#223355">audio input</text>
  <text x="145" y="107" text-anchor="middle" font-size="10" fill="#445">mic / file (cpal)</text>

  <rect x="260" y="78" width="170" height="36" rx="6" fill="#dce8f8" stroke="#4477cc" stroke-width="1.5"/>
  <text x="345" y="93" text-anchor="middle" font-weight="bold" fill="#223355">video input</text>
  <text x="345" y="107" text-anchor="middle" font-size="10" fill="#445">webcam / file (nokhwa)</text>

  <rect x="520" y="78" width="170" height="36" rx="6" fill="#ece4f8" stroke="#775599" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="605" y="93" text-anchor="middle" font-weight="bold" fill="#443366">text bypass</text>
  <text x="605" y="107" text-anchor="middle" font-size="10" fill="#554">stdin (debug / research)</text>

  <!-- Input → encoder arrows -->
  <line x1="145" y1="114" x2="145" y2="172" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="175" y1="114" x2="335" y2="172" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="345" y1="114" x2="545" y2="172" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="605" y1="114" x2="745" y2="172" stroke="#775599" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-purple)"/>

  <!-- ═══ ENCODERS (frozen) ═══ -->
  <rect x="40" y="150" width="810" height="78" rx="8" fill="none" stroke="#ccaa44" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="50" y="163" font-size="9" fill="#bb9922">somnus-encoding · frozen pretrained encoders</text>

  <rect x="60" y="172" width="170" height="50" rx="6" fill="#fff3d0" stroke="#aa8800" stroke-width="1.5"/>
  <text x="145" y="190" text-anchor="middle" font-weight="bold" fill="#554400">Whisper-tiny</text>
  <text x="145" y="204" text-anchor="middle" font-size="10" fill="#665">384-dim speech (ASR text)</text>
  <text x="145" y="216" text-anchor="middle" font-size="9" fill="#888">ORT/MIGraphX</text>

  <rect x="260" y="172" width="170" height="50" rx="6" fill="#fff3d0" stroke="#aa8800" stroke-width="1.5"/>
  <text x="345" y="190" text-anchor="middle" font-weight="bold" fill="#554400">CLAP-HTSAT</text>
  <text x="345" y="204" text-anchor="middle" font-size="10" fill="#665">512-dim environmental sound</text>
  <text x="345" y="216" text-anchor="middle" font-size="9" fill="#888">ORT/MIGraphX</text>

  <rect x="460" y="172" width="170" height="50" rx="6" fill="#fff3d0" stroke="#aa8800" stroke-width="1.5"/>
  <text x="545" y="190" text-anchor="middle" font-weight="bold" fill="#554400">DINOv3-ViT-S</text>
  <text x="545" y="204" text-anchor="middle" font-size="10" fill="#665">384-dim visual</text>
  <text x="545" y="216" text-anchor="middle" font-size="9" fill="#888">ORT/MIGraphX</text>

  <rect x="660" y="172" width="170" height="50" rx="6" fill="#f0e8f8" stroke="#775599" stroke-width="1.5"/>
  <text x="745" y="190" text-anchor="middle" font-weight="bold" fill="#442266">Qwen3 embed</text>
  <text x="745" y="204" text-anchor="middle" font-size="10" fill="#554">1024-dim mean-pooled</text>
  <text x="745" y="216" text-anchor="middle" font-size="9" fill="#888">+ LM hidden (--lang-use-lm)</text>

  <!-- Encoder → region arrows -->
  <line x1="145" y1="222" x2="135" y2="296" stroke="#aa8800" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="345" y1="222" x2="300" y2="296" stroke="#aa8800" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="545" y1="222" x2="465" y2="296" stroke="#aa8800" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="745" y1="222" x2="795" y2="296" stroke="#775599" stroke-width="1.2" marker-end="url(#arrow-purple)"/>

  <!-- ═══ REGIONAL CONCEPT AREAS ═══ -->
  <rect x="40" y="276" width="860" height="96" rx="10" fill="#e8f4e8" stroke="#336633" stroke-width="2"/>
  <text x="890" y="292" text-anchor="end" font-size="9" fill="#336633">somnus-perception</text>

  <rect x="60" y="296" width="150" height="26" rx="4" fill="#c8e6c8" stroke="#336633" stroke-width="1"/>
  <text x="135" y="313" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a3a1a">audio-speech [0]</text>

  <rect x="225" y="296" width="150" height="26" rx="4" fill="#c8e6c8" stroke="#336633" stroke-width="1"/>
  <text x="300" y="313" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a3a1a">audio-env [1]</text>

  <rect x="390" y="296" width="150" height="26" rx="4" fill="#c8e6c8" stroke="#336633" stroke-width="1"/>
  <text x="465" y="313" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a3a1a">visual [2]</text>

  <rect x="555" y="296" width="150" height="26" rx="4" fill="#c8e6c8" stroke="#336633" stroke-width="1"/>
  <text x="630" y="313" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a3a1a">symbolic [3]</text>

  <rect x="720" y="296" width="150" height="26" rx="4" fill="#d0c8f0" stroke="#775599" stroke-width="1"/>
  <text x="795" y="313" text-anchor="middle" font-size="10" font-weight="bold" fill="#221a44">language [4]</text>

  <text x="450" y="345" text-anchor="middle" font-size="12" font-weight="bold" fill="#224422">Regional concept areas — k-WTA (baseline n=1024, k=20, 2% sparsity) + SAE decoder</text>
  <text x="450" y="360" text-anchor="middle" font-size="10" fill="#224422">trainable (burn/CPU during NREM) · inference ORT/MIGraphX · grown to n=9,821 per region (2026-08-15)</text>

  <!-- Region → binding -->
  <line x1="450" y1="372" x2="450" y2="438" stroke="#336633" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="460" y="424" font-size="10" fill="#336633">5 region tokens</text>

  <!-- Top-down prior (binding → regions) -->
  <path d="M 200 438 V 374" stroke="#cc7700" stroke-width="1.2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrow-orange)"/>
  <text x="208" y="420" font-size="10" fill="#cc7700">top-down prior (β)</text>

  <!-- ═══ BINDING AREA ═══ -->
  <rect x="40" y="440" width="860" height="60" rx="8" fill="#f0f4ff" stroke="#4455aa" stroke-width="2"/>
  <text x="470" y="458" text-anchor="middle" font-size="12" font-weight="bold" fill="#223388">Binding area (integrative · hippocampal analogue)</text>
  <text x="470" y="473" text-anchor="middle" font-size="10" fill="#223388">4-head cross-attention over 5 region tokens (D_PROJ=128) + GRU temporal context (hidden=256) → 640-dim episode</text>
  <text x="470" y="487" text-anchor="middle" font-size="10" fill="#223388">working memory ring (WM=8) · GPU: perception_binding.onnx</text>

  <!-- Binding → episodic -->
  <line x1="450" y1="500" x2="450" y2="540" stroke="#4455aa" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- ═══ EPISODIC BUFFER (HOT) ═══ -->
  <rect x="240" y="540" width="420" height="70" rx="8" fill="#ffe8e8" stroke="#993333" stroke-width="2"/>
  <text x="450" y="558" text-anchor="middle" font-size="12" font-weight="bold" fill="#551111">Episodic buffer — HOT (VRAM)</text>
  <text x="450" y="573" text-anchor="middle" font-size="10" fill="#551111">bounded ring (CAPACITY=4096) · one-shot write per episode</text>
  <text x="450" y="588" text-anchor="middle" font-size="10" fill="#551111">sleep triggers: wakefulness pressure (S3) · high-water mark</text>
  <text x="450" y="601" text-anchor="middle" font-size="10" fill="#551111">schedule fallback · wake-performance degradation</text>

  <!-- Episodic → sleep -->
  <line x1="450" y1="610" x2="450" y2="645" stroke="#993333" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="460" y="630" font-size="10" fill="#993333">replay</text>

  <!-- ═══ SLEEP CYCLE ═══ -->
  <rect x="40" y="645" width="860" height="140" rx="10" fill="#fff8e8" stroke="#886600" stroke-width="2"/>
  <text x="470" y="664" text-anchor="middle" font-size="12" font-weight="bold" fill="#553300">Sleep cycle (wake/sleep controller)</text>

  <rect x="60" y="674" width="400" height="98" rx="6" fill="#fff0cc" stroke="#aa8800" stroke-width="1.5"/>
  <text x="260" y="692" text-anchor="middle" font-size="11" font-weight="bold" fill="#553300">NREM — consolidation</text>
  <text x="260" y="710" text-anchor="middle" font-size="10" fill="#553300">replay → k-WTA + SAE (AdamW, cosine LR)</text>
  <text x="260" y="724" text-anchor="middle" font-size="10" fill="#553300">homeostatic decay · hot→cold spill · warm dump</text>
  <text x="260" y="738" text-anchor="middle" font-size="10" fill="#553300">projection training (640→5×1024, cosine loss, CPU/Qwen)</text>

  <rect x="480" y="674" width="400" height="98" rx="6" fill="#f8f0ff" stroke="#775599" stroke-width="1.5"/>
  <text x="680" y="692" text-anchor="middle" font-size="11" font-weight="bold" fill="#442266">REM — generative</text>
  <text x="680" y="710" text-anchor="middle" font-size="10" fill="#442266">gist-level self-probe (k-means k=32, within-session)</text>
  <text x="680" y="724" text-anchor="middle" font-size="10" fill="#442266">growth: cascade-correlation unit add when ws_gist &lt; 0.85</text>
  <text x="680" y="738" text-anchor="middle" font-size="10" fill="#442266">creative recombination → synthetic → hot (next NREM)</text>

  <!-- Sleep → warm -->
  <line x1="260" y1="772" x2="260" y2="818" stroke="#aa8800" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ═══ MEMORY TIERS ═══ -->
  <rect x="60" y="818" width="360" height="62" rx="8" fill="#e8f0ff" stroke="#335599" stroke-width="2"/>
  <text x="240" y="838" text-anchor="middle" font-size="12" font-weight="bold" fill="#112255">Semantic store — WARM (RAM)</text>
  <text x="240" y="853" text-anchor="middle" font-size="10" fill="#112255">hnsw_rs HNSW (L2) · max 35% free RAM / 2500B</text>
  <text x="240" y="867" text-anchor="middle" font-size="10" fill="#112255">warm/records.bin · ef=16</text>

  <!-- Warm → cold -->
  <line x1="240" y1="880" x2="240" y2="928" stroke="#335599" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="248" y="910" font-size="10" fill="#335599">spill</text>

  <rect x="60" y="928" width="360" height="62" rx="8" fill="#e8ffe8" stroke="#226622" stroke-width="2"/>
  <text x="240" y="948" text-anchor="middle" font-size="12" font-weight="bold" fill="#113311">Cold archive — COLD (disk)</text>
  <text x="240" y="963" text-anchor="middle" font-size="10" fill="#113311">INT8 append-only · PQ codebook (27.5× compression)</text>
  <text x="240" y="977" text-anchor="middle" font-size="10" fill="#113311">max 20% free disk · 665B/record</text>

  <!-- Recollection layer -->
  <rect x="500" y="818" width="380" height="110" rx="8" fill="#f8ffe8" stroke="#447744" stroke-width="1.5"/>
  <text x="690" y="838" text-anchor="middle" font-size="12" font-weight="bold" fill="#224422">Recollection layer</text>
  <text x="690" y="853" text-anchor="middle" font-size="10" fill="#224422">cross-tier index, warm-first</text>
  <text x="690" y="867" text-anchor="middle" font-size="10" fill="#224422">warm == cold union (continuous sync)</text>
  <text x="690" y="881" text-anchor="middle" font-size="10" fill="#224422">warm rebuilt from cold on snapshot restore</text>
  <text x="690" y="895" text-anchor="middle" font-size="10" fill="#224422">ep_salience = warm L2 distance per episode</text>
  <text x="690" y="916" text-anchor="middle" font-size="10" fill="#666">cold→warm promote() is a stub (not needed yet)</text>

  <!-- Warm ↔ recollection -->
  <line x1="420" y1="842" x2="498" y2="842" stroke="#447744" stroke-width="1.2" marker-end="url(#arrow-green)"/>
  <line x1="498" y1="858" x2="422" y2="858" stroke="#447744" stroke-width="1.2" marker-end="url(#arrow-green)"/>

  <!-- Recall (wake): recollection → binding -->
  <path d="M 880 872 H 912 V 452 H 902" stroke="#447744" stroke-width="1.2" fill="none" stroke-dasharray="5,3" marker-end="url(#arrow-green)"/>

  <!-- Sleep → observability (dashed, runs between cold and recollection) -->
  <line x1="435" y1="785" x2="435" y2="1028" stroke="#888" stroke-width="1" stroke-dasharray="3,3" marker-end="url(#arrow)"/>

  <!-- ═══ SIDEBAR: ACTION DECODER ═══ -->
  <rect x="940" y="440" width="420" height="130" rx="8" fill="#fff0f8" stroke="#993366" stroke-width="2"/>
  <text x="1150" y="460" text-anchor="middle" font-size="12" font-weight="bold" fill="#551133">ActionDecoder</text>
  <text x="1150" y="478" text-anchor="middle" font-size="10" fill="#551133">linear 640→5×1024 (projection) · frozen Qwen3-0.6B (CPU)</text>
  <text x="1150" y="493" text-anchor="middle" font-size="10" fill="#551133">every episode: attn weights → per-region gain</text>
  <text x="1150" y="508" text-anchor="middle" font-size="10" fill="#551133">on query (stdin): autoregressive text → stdout JSON</text>
  <text x="1150" y="523" text-anchor="middle" font-size="10" fill="#551133">NREM: projection trained on LM hidden states (ADR 0015)</text>

  <!-- Binding → decoder -->
  <line x1="900" y1="488" x2="940" y2="488" stroke="#993366" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <!-- ═══ SIDEBAR: NEUROMODULATION ═══ -->
  <rect x="940" y="592" width="420" height="292" rx="8" fill="#fafaf0" stroke="#887700" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="1150" y="612" text-anchor="middle" font-size="12" font-weight="bold" fill="#554400">Neuromodulation (ADR 0024)</text>
  <text x="1150" y="628" text-anchor="middle" font-size="10" fill="#554400">EWMA self-regulation controllers</text>

  <text x="956" y="650" font-size="10" font-weight="bold" fill="#554400">S1 adaptive salience gate</text>
  <text x="972" y="664" font-size="10" fill="#776600">τ_s = μ_L2 + 0.5·σ_L2 (wake_reconstruct)</text>
  <text x="956" y="684" font-size="10" font-weight="bold" fill="#554400">S2 settle-rate modulation</text>
  <text x="972" y="698" font-size="10" fill="#776600">fire settle when cosine &lt; EWMA − 0.1</text>
  <text x="956" y="718" font-size="10" font-weight="bold" fill="#554400">S3 wakefulness pressure homeostat</text>
  <text x="972" y="732" font-size="10" fill="#776600">P += novelty/rate; sleep when P ≥ 1.0</text>
  <text x="956" y="752" font-size="10" font-weight="bold" fill="#554400">S4 prior-beta auto-scale</text>
  <text x="972" y="766" font-size="10" fill="#776600">β: 0.01→0.05 when 3-cycle cosine &gt; 0.65</text>
  <text x="956" y="786" font-size="10" font-weight="bold" fill="#554400">S5 startup-queryable priors</text>
  <text x="972" y="800" font-size="10" fill="#776600">max_warm = 35% RAM · max_cold = 20% disk</text>
  <text x="956" y="820" font-size="10" font-weight="bold" fill="#554400">S6 adaptive wake ceiling</text>
  <text x="972" y="834" font-size="10" fill="#776600">max_wake = max(600s, 3×wake_ewma)</text>
  <text x="956" y="846" font-size="10" font-weight="bold" fill="#554400">S7 wake-interval throttle</text>
  <text x="972" y="860" font-size="10" fill="#776600">decrement interval on MSE stagnation (3 cycles)</text>

  <!-- ═══ SIDEBAR: CAMPAIGN ═══ -->
  <rect x="940" y="898" width="420" height="104" rx="8" fill="#f0f8f0" stroke="#336633" stroke-width="1.5"/>
  <text x="1150" y="918" text-anchor="middle" font-size="11" font-weight="bold" fill="#224422">10x growth campaign (82 sessions, done 2026-08-15)</text>
  <text x="956" y="936" font-size="10" fill="#224422">units per region: 1024 → 9821 (101.7% of 9,660 target)</text>
  <text x="956" y="951" font-size="10" fill="#224422">791 cycles · 188 growth events · 0 panics</text>
  <text x="956" y="966" font-size="10" fill="#224422">output MSE, first vs last 10: 0.0430 → 0.0112 (−74%)</text>
  <text x="956" y="981" font-size="10" fill="#224422">gist_recall_rate 0.562 · warm_recall_l2 0.381</text>
  <text x="956" y="996" font-size="10" fill="#224422">details: ai-docs/engineering-log.md §34</text>

  <!-- ═══ OBSERVABILITY ═══ -->
  <rect x="40" y="1028" width="1320" height="56" rx="8" fill="#f4f4f4" stroke="#888" stroke-width="1.5"/>
  <text x="700" y="1046" text-anchor="middle" font-size="11" font-weight="bold" fill="#444">Observability and snapshots</text>
  <text x="700" y="1062" text-anchor="middle" font-size="10" fill="#444">per-cycle NDJSON (metrics_*.jsonl) · eval_metrics.py → PNG plots · train_campaign.sh drives multi-session runs</text>
  <text x="700" y="1076" text-anchor="middle" font-size="10" fill="#444">snapshot: weights + episodic + region sizes + EWMA state + warm/records.bin + wake/sal EWMA files</text>

  <!-- ═══ LEGEND ═══ -->
  <line x1="40" y1="1104" x2="72" y2="1104" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="78" y="1108" font-size="10" fill="#444">wake data flow</text>
  <line x1="200" y1="1104" x2="232" y2="1104" stroke="#cc7700" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow-orange)"/>
  <text x="238" y="1108" font-size="10" fill="#cc7700">top-down prior</text>
  <line x1="340" y1="1104" x2="372" y2="1104" stroke="#447744" stroke-width="1.2" stroke-dasharray="5,3" marker-end="url(#arrow-green)"/>
  <text x="378" y="1108" font-size="10" fill="#447744">recall (wake)</text>
  <line x1="480" y1="1104" x2="512" y2="1104" stroke="#775599" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-purple)"/>
  <text x="518" y="1108" font-size="10" fill="#775599">text / language path</text>
  <rect x="660" y="1097" width="12" height="12" fill="#fff3d0" stroke="#aa8800" stroke-width="1"/>
  <text x="678" y="1108" font-size="10" fill="#444">frozen (ORT/MIGraphX)</text>
  <rect x="820" y="1097" width="12" height="12" fill="#e8f4e8" stroke="#336633" stroke-width="1"/>
  <text x="838" y="1108" font-size="10" fill="#444">trainable (burn/CPU)</text>
</svg>
