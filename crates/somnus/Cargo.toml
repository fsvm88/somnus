[package]
name    = "somnus"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "somnus"
path = "src/main.rs"

[features]
# A/B candidate (gaps.md item 9): EfficientAT mn10 env encoder instead of CLAP-HTSAT.
# Forwards to somnus-encoding/somnus-perception's own mn10_env features (must move together).
mn10_env = ["somnus-encoding/mn10_env", "somnus-perception/mn10_env"]

[dependencies]
somnus-sensory        = { path = "../somnus-sensory" }
somnus-encoding       = { path = "../somnus-encoding" }
anyhow             = { workspace = true }
clap               = { workspace = true }
crossbeam-channel  = { workspace = true }
ort                = { workspace = true }
tokio              = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json         = { workspace = true }
somnus-perception     = { path = "../somnus-perception" }
somnus-memory         = { path = "../somnus-memory" }
burn               = { workspace = true }
burn-ndarray       = { workspace = true }
safetensors        = { workspace = true }
ndarray            = { workspace = true }
tokenizers         = "0.23"
sysinfo            = "0.39"
