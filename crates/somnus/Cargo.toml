[package]
name    = "somnus"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "somnus"
path = "src/main.rs"

[features]
# A/B candidate (gaps.md item 9): EfficientAT mn10 env encoder instead of CLAP-HTSAT.
# Forwards to somnus-encoding/somnus-perception's own mn10_env features (must move together).
mn10_env = ["somnus-encoding/mn10_env", "somnus-perception/mn10_env"]
# Fine-grained timing/counters (somnus-metrics). Off by default; forwards uniformly to every
# crate that has instrumentation call sites (must move together, same shape as mn10_env).
fine-metrics = [
    "somnus-metrics/fine-metrics",
    "somnus-perception/fine-metrics",
    "somnus-memory/fine-metrics",
    "somnus-sensory/fine-metrics",
    "somnus-encoding/fine-metrics",
]


# burn-flex is never imported directly; it is a direct dependency purely to request "rayon" on
# the shared instance (see the workspace Cargo.toml comment).
[package.metadata.cargo-machete]
ignored = ["burn-flex"]

[dependencies]
somnus-sensory        = { path = "../somnus-sensory" }
somnus-encoding       = { path = "../somnus-encoding" }
somnus-metrics        = { workspace = true }
anyhow             = { workspace = true }
clap               = { workspace = true }
crossbeam-channel  = { workspace = true }
ort                = { workspace = true }
tokio              = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json         = { workspace = true }
somnus-perception     = { path = "../somnus-perception" }
somnus-memory         = { path = "../somnus-memory" }
burn               = { workspace = true }
burn-flex  = { workspace = true }
burn-store   = { workspace = true }
safetensors        = { workspace = true }
ndarray            = { workspace = true }
tokenizers         = { version = "0.23", default-features = false, features = ["onig"] }
sysinfo            = { version = "0.39", default-features = false, features = ["disk", "system"] }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
