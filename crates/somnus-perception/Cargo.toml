[package]
name    = "somnus-perception"
version = "0.1.0"
edition = "2021"

[features]
# A/B candidate (gaps.md item 9): EfficientAT mn10 env encoder (960-dim) instead of
# CLAP-HTSAT (512-dim, default). Cold-start required — not runtime-selectable.
mn10_env = []
# Fine-grained timing/counters (somnus-metrics). Off by default; forwards to somnus-metrics'
# own feature of the same name, which is what actually gates the macro bodies.
fine-metrics = ["somnus-metrics/fine-metrics"]

# burn-ndarray is never directly imported here — NdArray/NdArrayDevice come from
# burn::backend (re-exported via burn's own "ndarray" feature). It stays a direct
# dependency purely to request "multi-threads"/"simd" on the shared build-graph
# instance: burn's own dependency on burn-ndarray sets default-features=false, so
# without this line the CPU backend silently loses rayon threading + SIMD. See
# Cargo.toml comment at the workspace level for the same note.
[package.metadata.cargo-machete]
ignored = ["burn-ndarray"]

[dependencies]
burn         = { workspace = true }
burn-ndarray = { workspace = true }
thiserror    = { workspace = true }
tracing      = { workspace = true }
serde_json   = { workspace = true }
ort          = { workspace = true }
ndarray      = { workspace = true }
anyhow           = { workspace = true }
matrixmultiply   = "0.3"
somnus-metrics      = { workspace = true }

[[bin]]
name = "bench_nrem_batch"
path = "src/bin/bench_nrem_batch.rs"

[[bin]]
name = "bench_wake_percep"
path = "src/bin/bench_wake_percep.rs"

[[bin]]
name = "onnx_validate_prepare"
path = "src/bin/onnx_validate_prepare.rs"

[[bin]]
name = "svd_rank_check"
path = "src/bin/svd_rank_check.rs"
